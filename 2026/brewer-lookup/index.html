<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brewer Lookup – CHBC (2026 Season)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 1rem;
      margin: 0;
      line-height: 1.4;
      color: #222;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; text-align: center; }
    .intro { text-align: center; color: #555; font-size: 0.95rem; margin: 0 auto 1rem; max-width: 60ch; }

    .controls {
      max-width: 1100px;
      margin: 0 auto 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
    }
    .controls input[type="text"] {
      padding: 0.45rem 0.6rem;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 1rem;
      min-width: 16rem;
    }
    .controls button {
      padding: 0.45rem 0.8rem;
      border: 1px solid #2c4a7a;
      background: #fff;
      color: #2c4a7a;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .controls button.primary,
    .controls button[aria-pressed="true"] { background: #2c4a7a; color: #fff; }
    .controls button:focus-visible,
    .controls input:focus-visible { outline: 2px solid #2c4a7a; outline-offset: 2px; }
    .divfilter { display: flex; gap: 0.25rem; }

    .division {
      background-color: #fff;
      padding: 1rem;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.08);
      border-radius: 6px;
      max-width: 1100px;
      margin: 0 auto 1rem;
      overflow-x: auto;
    }
    .brewer-name { font-size: 1.3rem; font-weight: bold; margin: 0; }
    .brewer-club { color: #555; margin: 0.1rem 0 0.75rem; }

    table { border-collapse: collapse; font-size: 0.8rem; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.3rem 0.45rem; text-align: left; white-space: nowrap; }
    th { background-color: #eaeaea; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.ctr, th.ctr { text-align: center; }

    .score tr.north td { background: #fce5cd; }
    .score tr.south td { background: #d9ead3; }
    .score tr.all td { background: #e3e3e3; font-weight: bold; border-top: 2px solid #555; }

    .detail tr.comp-head td { background: #f0f0f0; font-weight: bold; }
    .detail tr.not-counted td { color: #888; }
    .detail tr.bos-1 td { background: #fff2cc; }
    .detail tr.bos-2 td { background: #eeeeee; }
    .detail tr.bos-3 td { background: #fbe1cf; }

    .legend { font-size: 0.8rem; color: #555; margin-top: 0.6rem; }
    .message { text-align: center; color: #555; padding: 1rem; }

    a.back-link {
      display: block; text-align: center; margin-top: 1rem;
      color: #2c4a7a; text-decoration: none; font-weight: bold;
    }
    a.back-link:hover { text-decoration: underline; }
    .footer-note { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #444; }
  </style>
</head>
<body>

  <h1>🔎 Brewer Lookup (2026 Season)</h1>
  <p class="intro">See every placement for a brewer: the points from each competition, BOS bonuses, and which entries count toward the circuit.</p>

  <div class="controls">
    <input id="brewerInput" type="text" list="brewerList" placeholder="Start typing a brewer's name…"
           autocomplete="off" spellcheck="false" aria-label="Brewer name">
    <datalist id="brewerList"></datalist>
    <button id="showBtn" class="primary" type="button">Show results</button>
    <div class="divfilter" role="group" aria-label="Division">
      <button type="button" data-div="All" aria-pressed="true">All-State</button>
      <button type="button" data-div="North" aria-pressed="false">North</button>
      <button type="button" data-div="South" aria-pressed="false">South</button>
    </div>
  </div>

  <div id="results"><p class="message">Loading results…</p></div>

  <a class="back-link" href="/">← Back to Dashboard</a>
  <p class="footer-note">
    💡 Think something looks off?<br>
    Let us know on <a href="https://discord.gg/pFTj7vb2mU" target="_blank" rel="noopener">the CHBC Discord</a>.
  </p>

  <script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRWYM73RUcLh6Wd7jv4dq3ZYPph7MuCHQfeR66_zTN1BIUfYJyU_ya9kKxPxyGbwdcMLdKXtOuZ3W-1/pub?gid=1094709211&single=true&output=csv";

    let allRows = [];
    let brewers = [];
    let currentDiv = "All";

    // Handles commas inside quoted names and clubs
    function parseCSV(data) {
      const rows = [];
      let row = [], field = "", inQuotes = false;
      for (let i = 0; i < data.length; i++) {
        const c = data[i];
        if (inQuotes) {
          if (c === '"' && data[i + 1] === '"') { field += '"'; i++; }
          else if (c === '"') inQuotes = false;
          else field += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ""; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && data[i + 1] === '\n') i++;
          row.push(field); rows.push(row); row = []; field = "";
        } else field += c;
      }
      if (field || row.length) { row.push(field); rows.push(row); }
      const headers = rows[0].map(h => h.trim());
      return rows.slice(1)
        .filter(r => r.some(v => v.trim() !== ""))
        .map(r => {
          const obj = {};
          headers.forEach((h, i) => obj[h] = (r[i] || "").trim());
          return obj;
        });
    }

    const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
    const fmt = n => n.toFixed(3);
    const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const placeKey = p => p.toLowerCase().replace(/^bos\s+/, "");

    function summarize(rows) {
      const s = { total: 0, gold: 0, silver: 0, bronze: 0, hm: 0, bos1: 0, bos2: 0, bos3: 0 };
      rows.forEach(r => {
        s.total += num(r.Total);
        const p = placeKey(r.Place);
        if (!r.Place.toLowerCase().startsWith("bos")) {
          if (p === "1st") s.gold++;
          else if (p === "2nd") s.silver++;
          else if (p === "3rd") s.bronze++;
          else if (p === "hm") s.hm++;
        }
        const bos = num(r.BOS);
        if (bos === 3) s.bos1++;
        else if (bos === 2) s.bos2++;
        else if (bos === 1) s.bos3++;
      });
      s.medals = s.gold + s.silver + s.bronze;
      return s;
    }

    function scoreRow(label, cls, s) {
      return `<tr class="${cls}"><td>${label}</td><td class="num">${fmt(s.total)}</td>` +
        `<td class="ctr">${s.medals}</td><td class="ctr">${s.gold}</td><td class="ctr">${s.silver}</td>` +
        `<td class="ctr">${s.bronze}</td><td class="ctr">${s.hm}</td>` +
        `<td class="ctr">${s.bos1}</td><td class="ctr">${s.bos2}</td><td class="ctr">${s.bos3}</td></tr>`;
    }

    function render(name) {
      const out = document.getElementById("results");
      const rows = allRows.filter(r => r.Brewer.toLowerCase() === name.toLowerCase());
      if (!rows.length) {
        out.innerHTML = `<p class="message">No results found for "${esc(name)}". Pick a name from the list as you type.</p>`;
        return;
      }
      const brewer = rows[0].Brewer;
      const clubs = [...new Set(rows.map(r => r.Club).filter(Boolean))];
      const north = rows.filter(r => r.Division === "North");
      const south = rows.filter(r => r.Division === "South");

      let html = `<div class="division">
        <p class="brewer-name">${esc(brewer)}</p>
        <p class="brewer-club">${clubs.length ? esc(clubs.join(" / ")) : "No club listed"}</p>
        <table class="score">
          <thead><tr><th>Division</th><th class="num">Points</th><th class="ctr">Medals</th>
            <th class="ctr">🥇</th><th class="ctr">🥈</th><th class="ctr">🥉</th><th class="ctr">HM</th>
            <th class="ctr">BOS 🥇</th><th class="ctr">BOS 🥈</th><th class="ctr">BOS 🥉</th></tr></thead>
          <tbody>
            ${scoreRow("North", "north", summarize(north))}
            ${scoreRow("South", "south", summarize(south))}
            ${scoreRow("All-State", "all", summarize(rows))}
          </tbody>
        </table>
      </div>`;

      const shown = rows.filter(r => currentDiv === "All" || r.Division === currentDiv)
        .sort((a, b) => (a.Division === b.Division ? 0 : a.Division === "North" ? -1 : 1));

      html += `<div class="division">`;
      if (!shown.length) {
        html += `<p class="message">No ${esc(currentDiv)} Division placements yet.</p>`;
      } else {
        html += `<table class="detail"><thead><tr>
          <th>Competition</th><th>Style</th><th>Entry</th><th class="ctr">Place</th><th class="num">Entries</th>
          <th class="num">Score</th><th class="num">BOS</th><th class="num">Total</th><th class="ctr">Counts</th>
          </tr></thead><tbody>`;
        let lastComp = null;
        shown.forEach(r => {
          if (r.Competition !== lastComp) {
            const compTotal = shown.filter(x => x.Competition === r.Competition).reduce((t, x) => t + num(x.Total), 0);
            html += `<tr class="comp-head"><td colspan="7">${esc(r.Competition)} (${esc(r.Division)})</td>` +
                    `<td class="num">${fmt(compTotal)}</td><td></td></tr>`;
            lastComp = r.Competition;
          }
          const bos = num(r.BOS);
          const cls = [r.Counts === "No" ? "not-counted" : "", bos === 3 ? "bos-1" : bos === 2 ? "bos-2" : bos === 1 ? "bos-3" : ""].join(" ").trim();
          const counts = r.Counts === "Yes" ? "✅" : r.Counts === "No" ? "❌" : "";
          html += `<tr class="${cls}"><td></td><td>${esc(r.Style)}</td><td>${esc(r["Entry Name"])}</td>` +
            `<td class="ctr">${esc(r.Place)}</td><td class="num">${esc(r.Entries)}</td>` +
            `<td class="num">${r.Score === "" ? "" : fmt(num(r.Score))}</td><td class="num">${bos ? fmt(bos) : ""}</td>` +
            `<td class="num">${fmt(num(r.Total))}</td><td class="ctr">${counts}</td></tr>`;
        });
        html += `</tbody></table>
          <p class="legend">Only a brewer's top 3 weighted placements per competition count (✅). ❌ placements score 0.
          BOS points are added on top. Highlighted rows won Best of Show (gold, silver, bronze).
          Team entries are credited to the first brewer listed.</p>`;
      }
      html += `</div>`;
      out.innerHTML = html;

      const url = new URL(window.location);
      url.searchParams.set("brewer", brewer);
      history.replaceState(null, "", url);
    }

    function showFromInput() {
      const name = document.getElementById("brewerInput").value.trim();
      if (name) render(name);
    }

    fetch(csvUrl, { cache: "no-store" })
      .then(r => r.text())
      .then(csv => {
        allRows = parseCSV(csv);
        brewers = [...new Set(allRows.map(r => r.Brewer).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
        document.getElementById("brewerList").innerHTML = brewers.map(b => `<option value="${esc(b)}">`).join("");

        const input = document.getElementById("brewerInput");
        document.getElementById("showBtn").onclick = showFromInput;
        input.addEventListener("keydown", e => { if (e.key === "Enter") showFromInput(); });
        input.addEventListener("change", showFromInput);

        document.querySelectorAll(".divfilter button").forEach(btn => {
          btn.onclick = () => {
            currentDiv = btn.dataset.div;
            document.querySelectorAll(".divfilter button").forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
            showFromInput();
          };
        });

        const fromUrl = new URLSearchParams(window.location.search).get("brewer");
        if (fromUrl) { input.value = fromUrl; render(fromUrl); }
        else document.getElementById("results").innerHTML =
          `<p class="message">Type a brewer's name above to see their results.</p>`;
      })
      .catch(err => {
        document.getElementById("results").innerHTML =
          `<p class="message">Results couldn't be loaded. Refresh the page to try again.</p>`;
        console.error(err);
      });
  </script>
<script data-goatcounter="https://chbcircuit.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
